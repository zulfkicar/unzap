services:
  app:
    build: .
    ports: ["127.0.0.1:8874:8874"]
    volumes: ["control:/app/.data/control"]
    environment:
      ENABLE_LIVE: "false"
      SEED_DEMO: "true"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen3:4b"
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    profiles: ["agent"]
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["models:/root/.ollama"]
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NO_CLOUD: "1"
    mem_limit: 5g
    cpus: 4
    restart: unless-stopped
volumes:
  control:
  models:
